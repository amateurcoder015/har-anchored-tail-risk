[project]
name = "har-anchored-tail-risk"
version = "0.1.0"
description = "HAR-anchored VaR/ES forecasting with bounded state corrections"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "arch>=7.0",
    "yfinance>=0.2.54",
    "pyyaml>=6.0",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volgate", "src/hart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
